<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Club Jazmin FC — Cartera</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --verde:#1A56A8;--verde-med:#1E6FCC;--verde-clar:#E8F0FB;
  --rojo:#C0392B;--rojo-clar:#FDEDEC;
  --ambar:#E67E22;--ambar-clar:#FEF9E7;
  --azul:#2471A3;--azul-clar:#EBF5FB;
  --gris:#5D6D7E;--gris-clar:#F4F6F7;
  --bg:#F8F9FA;--card:#FFFFFF;
  --border:#E8ECEF;--text:#1A1D23;--text2:#6B7280;
  --shadow:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.06);
  --shadow-md:0 4px 6px rgba(0,0,0,.07),0 2px 4px rgba(0,0,0,.06);
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
/* TOPBAR */
.topbar{background:#1A3A6B;padding:0 16px;height:56px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.topbar-left{display:flex;align-items:center;gap:10px}
.topbar-logo{width:34px;height:34px;background:rgba(255,255,255,.2);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:18px}
.topbar-title{color:#fff;font-size:15px;font-weight:600;line-height:1.2}
.topbar-title small{font-size:11px;font-weight:400;opacity:.75;display:block}
.role-switcher{display:flex;gap:4px}
.role-btn{padding:5px 10px;border-radius:6px;font-size:12px;font-weight:500;cursor:pointer;border:1.5px solid rgba(255,255,255,.3);color:rgba(255,255,255,.8);background:transparent;transition:.15s}
.role-btn.active{background:#fff;color:#1A3A6B;border-color:#fff}
/* NAV */
.nav{background:var(--card);border-bottom:1px solid var(--border);display:flex;overflow-x:auto;padding:0 12px;gap:2px;position:sticky;top:56px;z-index:40}
.nav::-webkit-scrollbar{display:none}
.nav-btn{padding:12px 14px;font-size:13px;font-weight:500;color:var(--text2);border:none;background:none;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;transition:.15s}
.nav-btn.active{color:#1A56A8;border-bottom-color:#1A56A8}
/* CONTENT */
.content{padding:16px;max-width:800px;margin:0 auto}
.section{display:none}.section.active{display:block}
/* CARDS */
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
.card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.card-title{font-size:14px;font-weight:600;color:var(--text)}
/* STATS */
.stats-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
@media(min-width:480px){.stats-grid{grid-template-columns:repeat(4,1fr)}}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;box-shadow:var(--shadow)}
.stat-label{font-size:11px;color:var(--text2);font-weight:500;margin-bottom:6px;text-transform:uppercase;letter-spacing:.4px}
.stat-value{font-size:26px;font-weight:700;line-height:1}
.stat-sub{font-size:11px;margin-top:4px;color:var(--text2)}
.stat-verde .stat-value{color:#1A56A8}
.stat-rojo .stat-value{color:var(--rojo)}
.stat-ambar .stat-value{color:var(--ambar)}
.stat-azul .stat-value{color:var(--azul)}
/* SEARCH */
.search-bar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.search-bar input,.search-bar select{padding:9px 12px;border:1px solid var(--border);border-radius:8px;font-size:13px;background:var(--card);color:var(--text);outline:none}
.search-bar input{flex:1;min-width:120px}
.search-bar input:focus,.search-bar select:focus{border-color:var(--verde)}
/* JUGADOR ITEM */
.jugador-item{display:flex;align-items:center;gap:12px;padding:11px 14px;border:1px solid var(--border);border-radius:10px;margin-bottom:6px;background:var(--card);cursor:pointer;transition:.15s;box-shadow:var(--shadow)}
.jugador-item:hover{border-color:var(--verde);transform:translateY(-1px);box-shadow:var(--shadow-md)}
.avatar{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;flex-shrink:0}
.av-verde{background:#E8F0FB;color:#1A56A8}
.av-rojo{background:var(--rojo-clar);color:var(--rojo)}
.av-ambar{background:var(--ambar-clar);color:var(--ambar)}
.av-gris{background:var(--gris-clar);color:var(--gris)}
.jugador-info{flex:1;min-width:0}
.jugador-nombre{font-size:13px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.jugador-meta{font-size:11px;color:var(--text2);margin-top:2px}
.jugador-right{text-align:right;flex-shrink:0}
/* BADGES */
.badge{display:inline-block;padding:3px 8px;border-radius:20px;font-size:11px;font-weight:600}
.badge-verde{background:#E8F0FB;color:#1A56A8}
.badge-rojo{background:var(--rojo-clar);color:var(--rojo)}
.badge-ambar{background:var(--ambar-clar);color:var(--ambar)}
.badge-gris{background:var(--gris-clar);color:var(--gris)}
.monto{font-size:12px;color:var(--text2);margin-top:3px}
/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border-radius:8px;font-size:13px;font-weight:500;cursor:pointer;border:1px solid var(--border);background:var(--card);color:var(--text);transition:.15s;line-height:1}
.btn:hover{background:var(--gris-clar)}
.btn-verde{background:#1A56A8;color:#fff;border-color:#1A56A8}
.btn-verde:hover{background:#1E6FCC}
.btn-rojo{background:var(--rojo);color:#fff;border-color:var(--rojo)}
.btn-rojo:hover{opacity:.9}
.btn-wa{background:#25D366;color:#fff;border-color:#25D366}
.btn-wa:hover{opacity:.9}
.btn-email{background:var(--azul);color:#fff;border-color:var(--azul)}
.btn-email:hover{opacity:.9}
.btn-sm{padding:6px 11px;font-size:12px}
.btn-xs{padding:4px 8px;font-size:11px}
/* FORM */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:480px){.form-grid{grid-template-columns:1fr}}
.form-group{display:flex;flex-direction:column;gap:5px}
.form-group.full{grid-column:1/-1}
.form-label{font-size:12px;color:var(--text2);font-weight:600;text-transform:uppercase;letter-spacing:.4px}
.form-input{padding:9px 12px;border:1px solid var(--border);border-radius:8px;font-size:13px;background:var(--card);color:var(--text);outline:none;transition:.15s}
.form-input:focus{border-color:#1A56A8;box-shadow:0 0 0 3px rgba(26,86,168,.15)}
.form-actions{display:flex;gap:8px;margin-top:16px;justify-content:flex-end}
/* MODAL */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;align-items:flex-end;justify-content:center;padding:0}
.overlay.open{display:flex}
@media(min-width:520px){.overlay{align-items:center;padding:16px}}
.modal{background:var(--card);border-radius:16px 16px 0 0;width:100%;max-width:460px;max-height:90vh;overflow-y:auto}
@media(min-width:520px){.modal{border-radius:16px}}
.modal-header{padding:16px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:var(--card);z-index:1}
.modal-title{font-size:15px;font-weight:600}
.modal-close{background:none;border:none;font-size:20px;cursor:pointer;color:var(--text2);line-height:1;padding:4px}
.modal-body{padding:18px}
/* INFO ROWS */
.info-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--border)}
.info-row:last-child{border:none}
.info-key{font-size:12px;color:var(--text2);font-weight:500}
.info-val{font-size:13px;font-weight:600;color:var(--text)}
/* MSG PREVIEW */
.msg-box{background:var(--gris-clar);border-radius:10px;padding:12px;font-size:12px;line-height:1.7;color:var(--text);margin:12px 0;white-space:pre-line;border-left:3px solid #1A56A8}
/* ACTION BTNS */
.action-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
/* ESTADO SELECT */
.estado-select{padding:8px 12px;border:1px solid var(--border);border-radius:8px;font-size:13px;background:var(--card);color:var(--text);width:100%;margin-top:6px;outline:none}
.estado-select:focus{border-color:#1A56A8}
/* LOADING */
.loading{text-align:center;padding:32px;color:var(--text2);font-size:13px}
.spinner{display:inline-block;width:20px;height:20px;border:2px solid var(--border);border-top-color:#1A56A8;border-radius:50%;animation:spin .6s linear infinite;margin-right:8px;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
/* EMPTY */
.empty{text-align:center;padding:40px 20px;color:var(--text2)}
.empty-icon{font-size:36px;margin-bottom:10px}
.empty-text{font-size:13px}
/* PROFES */
.profes-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.profe-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;text-align:center;box-shadow:var(--shadow)}
.profe-av{width:44px;height:44px;border-radius:50%;background:#E8F0FB;color:#1A56A8;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;margin:0 auto 10px}
.profe-nombre{font-size:13px;font-weight:600}
.profe-cats{font-size:11px;color:var(--text2);margin-top:3px;line-height:1.5}
.profe-stat{font-size:12px;color:#1A56A8;margin-top:8px;font-weight:600}
/* TOAST */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(10px);background:#1A1D23;color:#fff;padding:11px 20px;border-radius:10px;font-size:13px;z-index:200;opacity:0;transition:.25s;pointer-events:none;white-space:nowrap;box-shadow:0 4px 16px rgba(0,0,0,.3)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
/* CAT ROWS */
.cat-row{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--border)}
.cat-row:last-child{border:none}
.progress-bar{height:4px;background:var(--border);border-radius:2px;margin-top:4px;overflow:hidden}
.progress-fill{height:100%;background:#1A56A8;border-radius:2px;transition:.5s}
/* HISTORIAL */
.historial-item{padding:10px 14px;border:1px solid var(--border);border-radius:10px;margin-bottom:6px;background:var(--card);display:flex;align-items:center;gap:12px}
.hist-dot{width:8px;height:8px;border-radius:50%;background:#1A56A8;flex-shrink:0}
.hist-info{flex:1}
.hist-nombre{font-size:13px;font-weight:600}
.hist-meta{font-size:11px;color:var(--text2);margin-top:2px}
.hist-val{font-size:13px;font-weight:700;color:#1A56A8}
</style>
</head>

function toast(msg, duration=2500){

// ── LOAD DATA ──
async function loadJugadores(){
  const {data,error} = await sb.from('jugadores').select('*').order('nombre');
  if(error){ toast('Error al cargar datos'); console.error(error); return; }
  jugadores = data || [];
  populateCatFilter();
  renderDashboard();
  renderJugadores();
  renderProfes();
}

function populateCatFilter(){
  const cats=[...new Set(jugadores.map(j=>j.categoria))].sort();
  const sel=document.getElementById('f-cat-filter');
  const cur=sel.value;
  sel.innerHTML='<option value="">Todas las cats</option>'+cats.map(c=>`<option ${c===cur?'selected':''}>${c}</option>`).join('');
}

// ── DASHBOARD ──
function renderDashboard(){
  const total=jugadores.length;
  const pagados=jugadores.filter(j=>j.estado==='PAGO').length;
  const vencidos=jugadores.filter(j=>j.estado==='VENCIDO').length;
  const recaudo=jugadores.filter(j=>j.estado==='PAGO').reduce((a,j)=>a+(j.valor||0),0);

  document.getElementById('st-total').textContent=total;
  document.getElementById('st-pagados').textContent=pagados;
  document.getElementById('st-pct').textContent=total?Math.round(pagados/total*100)+'% al día':'';
  document.getElementById('st-vencidos').textContent=vencidos;
  document.getElementById('st-recaudo').textContent='$'+fmt(recaudo);

  const urgentes=jugadores.filter(j=>j.estado==='VENCIDO').slice(0,5);
  document.getElementById('urgentes-list').innerHTML = urgentes.length
    ? urgentes.map(j=>`
      <div class="jugador-item" onclick="abrirDetalle(${j.id})">
        <div class="avatar av-rojo">${initials(j.nombre)}</div>
        <div class="jugador-info">
          <div class="jugador-nombre">${j.nombre}</div>
          <div class="jugador-meta">${j.categoria} · ${j.acudiente||'Sin acudiente'}</div>
        </div>
        <div class="jugador-right">
          <div class="monto" style="color:var(--rojo);font-weight:700">$${fmt(j.valor)}</div>
        </div>
      </div>`).join('')
    : '<div class="empty"><div class="empty-icon">🎉</div><div class="empty-text">Sin vencidos</div></div>';

  const cats={};
  jugadores.forEach(j=>{
    if(!cats[j.categoria]) cats[j.categoria]={total:0,pagados:0,recaudo:0};
    cats[j.categoria].total++;
    if(j.estado==='PAGO'){cats[j.categoria].pagados++;cats[j.categoria].recaudo+=(j.valor||0);}
  });
  document.getElementById('cat-resumen').innerHTML = Object.entries(cats)
    .sort((a,b)=>b[1].recaudo-a[1].recaudo)
    .map(([cat,d])=>{
      const pct=d.total?Math.round(d.pagados/d.total*100):0;
      return `<div class="cat-row">
        <div>
          <div style="font-size:13px;font-weight:600">${cat} <span style="font-size:11px;color:var(--text2);font-weight:400">${PROFES[cat]||''}</span></div>
          <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
        </div>
        <div style="text-align:right;margin-left:16px">
          <div style="font-size:13px;font-weight:700;color:var(--verde)">$${fmt(d.recaudo)}</div>
          <div style="font-size:11px;color:var(--text2)">${d.pagados}/${d.total}</div>
        </div>
      </div>`;
    }).join('');
}

// ── JUGADORES ──
function renderJugadores(){
  const q=(document.getElementById('search-q').value||'').toLowerCase();
  const cat=document.getElementById('f-cat-filter').value;
  const est=document.getElementById('f-estado-filter').value;
  let lista=jugadores;
  if(q) lista=lista.filter(j=>j.nombre.toLowerCase().includes(q)||(j.acudiente||'').toLowerCase().includes(q));
  if(cat) lista=lista.filter(j=>j.categoria===cat);
  if(est) lista=lista.filter(j=>j.estado===est);
  document.getElementById('jugadores-list').innerHTML = lista.length
    ? lista.map(j=>`
      <div class="jugador-item" onclick="abrirDetalle(${j.id})">
        <div class="avatar ${avClass(j.estado)}">${initials(j.nombre)}</div>
        <div class="jugador-info">
          <div class="jugador-nombre">${j.nombre}</div>
          <div class="jugador-meta">${j.categoria} · Día ${j.dia_pago||'?'} · ${PROFES[j.categoria]||''}</div>
        </div>
        <div class="jugador-right">
          ${badgeHTML(j.estado)}
          <div class="monto">$${fmt(j.valor)}</div>
        </div>
      </div>`).join('')
    : '<div class="empty"><div class="empty-icon">🔍</div><div class="empty-text">No se encontraron jugadores</div></div>';
}

// ── COBROS ──
function renderCobros(){
  const vencidos=jugadores.filter(j=>j.estado==='VENCIDO');
  document.getElementById('cobros-count').textContent=`${vencidos.length} jugadores con pago pendiente`;
  document.getElementById('cobros-list').innerHTML = vencidos.length
    ? vencidos.map(j=>`
      <div class="jugador-item">
        <div class="avatar av-rojo">${initials(j.nombre)}</div>
        <div class="jugador-info" onclick="abrirDetalle(${j.id})" style="cursor:pointer">
          <div class="jugador-nombre">${j.nombre}</div>
          <div class="jugador-meta">${j.categoria} · ${j.acudiente||''} · ${j.observaciones||''}</div>
        </div>
        <div class="jugador-right">
          <div class="monto" style="color:var(--rojo);font-weight:700;margin-bottom:4px">$${fmt(j.valor)}</div>
          <div style="display:flex;gap:4px">
            ${j.telefono?`<button class="btn btn-xs btn-wa" onclick="enviarWADirecto(${j.id})">📱</button>`:''}
            <button class="btn btn-xs btn-verde" onclick="marcarPagadoDirecto(${j.id})">✅</button>
          </div>
        </div>
      </div>`).join('')
    : '<div class="empty"><div class="empty-icon">🎉</div><div class="empty-text">Sin cobros pendientes</div></div>';
}

// ── HISTORIAL ──
async function loadHistorial(){
  const {data,error}=await sb.from('historial_pagos').select('*').order('created_at',{ascending:false}).limit(50);
  if(error){ toast('Error cargando historial'); return; }
  const list=data||[];
  document.getElementById('historial-list').innerHTML = list.length
    ? list.map(h=>`
      <div class="historial-item">
        <div class="hist-dot"></div>
        <div class="hist-info">
          <div class="hist-nombre">${h.nombre_jugador}</div>
          <div class="hist-meta">${h.mes_pagado||''} · ${h.metodo||''} · ${h.registrado_por||''} · ${new Date(h.created_at).toLocaleDateString('es-CO')}</div>
        </div>
        <div class="hist-val">$${fmt(h.valor)}</div>
      </div>`).join('')
    : '<div class="empty"><div class="empty-icon">📋</div><div class="empty-text">Sin pagos registrados aún</div></div>';
}

// ── PROFES ──
function renderProfes(){
  const profes={};
  jugadores.forEach(j=>{
    const p=PROFES[j.categoria]||'Sin asignar';
    if(!profes[p]) profes[p]={cats:new Set(),total:0,pagados:0,vencidos:0};
    profes[p].cats.add(j.categoria);
    profes[p].total++;
    if(j.estado==='PAGO') profes[p].pagados++;
    if(j.estado==='VENCIDO') profes[p].vencidos++;
  });
  document.getElementById('profes-grid').innerHTML = Object.entries(profes).map(([nombre,d])=>`
    <div class="profe-card">
      <div class="profe-av">${nombre.slice(0,2).toUpperCase()}</div>
      <div class="profe-nombre">${nombre}</div>
      <div class="profe-cats">${[...d.cats].sort().join(', ')}</div>
      <div class="profe-stat">${d.pagados}/${d.total} pagados</div>
      ${d.vencidos?`<div style="font-size:11px;color:var(--rojo);margin-top:3px">${d.vencidos} vencido${d.vencidos>1?'s':''}</div>`:''}
    </div>`).join('');
}

// ── DETALLE MODAL ──
function abrirDetalle(id){
  selectedJ = jugadores.find(j=>j.id===id);
  if(!selectedJ) return;
  const j=selectedJ;
  document.getElementById('m-nombre').textContent=j.nombre;
  document.getElementById('m-estado').value=j.estado||'VENCIDO';
  document.getElementById('m-info').innerHTML=`
    <div class="info-row"><span class="info-key">Categoría</span><span class="info-val">${j.categoria}</span></div>
    <div class="info-row"><span class="info-key">Profe</span><span class="info-val">${PROFES[j.categoria]||'—'}</span></div>
    <div class="info-row"><span class="info-key">Mensualidad</span><span class="info-val">$${fmt(j.valor)}</span></div>
    <div class="info-row"><span class="info-key">Día de pago</span><span class="info-val">${j.dia_pago||'—'}</span></div>
    <div class="info-row"><span class="info-key">Acudiente</span><span class="info-val">${j.acudiente||'—'}</span></div>
    <div class="info-row"><span class="info-key">Teléfono</span><span class="info-val">${j.telefono||'—'}</span></div>
    <div class="info-row"><span class="info-key">Correo</span><span class="info-val" style="font-size:12px">${j.email||'—'}</span></div>
    <div class="info-row"><span class="info-key">Método</span><span class="info-val">${j.metodo_pago||'—'}</span></div>
    ${j.observaciones?`<div class="info-row"><span class="info-key">Obs</span><span class="info-val" style="font-size:12px">${j.observaciones}</span></div>`:''}
  `;
  document.getElementById('m-msg').textContent=generarMensaje(j);
  document.getElementById('overlay').classList.add('open');
}

function generarMensaje(j){
  return `Hola ${j.acudiente||'acudiente'}, le saluda el Club Jazmin FC.\n\nLe recordamos que la mensualidad de *${j.nombre}* (${j.categoria}) por valor de *$${fmt(j.valor)}* se encuentra pendiente de pago.\n\nPuede realizar su pago a través de:\n• Nequi: 300 000 0000\n• Bold: 300 000 0000\n\nGracias por su puntualidad 🙏\nClub Deportivo Jazmin FC`;
}

function cerrarOverlay(e){
  if(e.target===document.getElementById('overlay'))
    document.getElementById('overlay').classList.remove('open');
}

// ── ACTUALIZAR ESTADO ──
async function actualizarEstado(){
  if(!selectedJ) return;
  const nuevo=document.getElementById('m-estado').value;
  const {error}=await sb.from('jugadores').update({estado:nuevo}).eq('id',selectedJ.id);
  if(error){ toast('Error al actualizar'); return; }
  selectedJ.estado=nuevo;
  jugadores=jugadores.map(j=>j.id===selectedJ.id?{...j,estado:nuevo}:j);
  toast('Estado actualizado ✅');
  renderDashboard(); renderJugadores(); renderCobros();
}

async function marcarPagadoModal(){
  if(!selectedJ) return;
  await sb.from('jugadores').update({estado:'PAGO'}).eq('id',selectedJ.id);
  await registrarPago(selectedJ);
  selectedJ.estado='PAGO';
  jugadores=jugadores.map(j=>j.id===selectedJ.id?{...j,estado:'PAGO'}:j);
  document.getElementById('m-estado').value='PAGO';
  toast('✅ Marcado como pagado y registrado en historial');
  renderDashboard(); renderJugadores(); renderCobros();
}

async function marcarPagadoDirecto(id){
  const j=jugadores.find(x=>x.id===id);
  if(!j) return;
  await sb.from('jugadores').update({estado:'PAGO'}).eq('id',id);
  await registrarPago(j);
  jugadores=jugadores.map(x=>x.id===id?{...x,estado:'PAGO'}:x);
  toast('✅ '+j.nombre.split(' ')[0]+' marcado como pagado');
  renderDashboard(); renderCobros();
}

async function registrarPago(j){
  const mes=['ENERO','FEBRERO','MARZO','ABRIL','MAYO','JUNIO','JULIO','AGOSTO','SEPTIEMBRE','OCTUBRE','NOVIEMBRE','DICIEMBRE'][new Date().getMonth()];
  await sb.from('historial_pagos').insert({
    jugador_id:j.id, nombre_jugador:j.nombre,
    mes_pagado:mes, valor:j.valor,
    metodo:j.metodo_pago, registrado_por:currentRole
  });
}

// ── COBRAR ──
function enviarWA(){
  if(!selectedJ) return;
  if(!selectedJ.telefono){ toast('Sin número registrado'); return; }
  const msg=encodeURIComponent(generarMensaje(selectedJ));
  const tel=selectedJ.telefono.replace(/\D/g,'');
  window.open('https://wa.me/57'+tel+'?text='+msg,'_blank');
}

function enviarEmail(){
  if(!selectedJ) return;
  if(!selectedJ.email){ toast('Sin correo registrado'); return; }
  const subj=encodeURIComponent('Recordatorio pago mensualidad — Club Jazmin FC');
  const body=encodeURIComponent(generarMensaje(selectedJ));
  window.open('mailto:'+selectedJ.email+'?subject='+subj+'&body='+body,'_blank');
}

function enviarWADirecto(id){
  const j=jugadores.find(x=>x.id===id);
  if(!j||!j.telefono){ toast('Sin número registrado'); return; }
  const msg=encodeURIComponent(generarMensaje(j));
  window.open('https://wa.me/57'+j.telefono.replace(/\D/g,'')+'?text='+msg,'_blank');
}

function cobrarTodos(){
  const vencidos=jugadores.filter(j=>j.estado==='VENCIDO'&&j.telefono);
  if(!vencidos.length){ toast('Sin vencidos con teléfono registrado'); return; }
  toast(`Abriendo WA para ${vencidos[0].nombre.split(' ')[0]}...`);
  setTimeout(()=>enviarWADirecto(vencidos[0].id),400);
}

// ── INSCRIBIR ──
async function inscribirJugador(){
  const nombre=(document.getElementById('fn-nombre').value||'').trim().toUpperCase();
  if(!nombre){ toast('Escribe el nombre del jugador'); return; }
  const nuevo={
    nombre, categoria:document.getElementById('fn-cat').value,
    estado:'VENCIDO',
    valor:parseInt(document.getElementById('fn-valor').value)||180000,
    dia_pago:parseInt(document.getElementById('fn-dia').value)||1,
    acudiente:document.getElementById('fn-acudiente').value.trim(),
    telefono:document.getElementById('fn-tel').value.trim(),
    email:document.getElementById('fn-email').value.trim(),
    metodo_pago:document.getElementById('fn-metodo').value,
    observaciones:document.getElementById('fn-obs').value.trim(),
  };
  const {data,error}=await sb.from('jugadores').insert(nuevo).select();
  if(error){ toast('Error al inscribir: '+error.message); return; }
  jugadores.push(data[0]);
  toast('✅ '+nombre.split(' ')[0]+' inscrito correctamente');
  limpiarForm();
  renderDashboard(); populateCatFilter();
}

function limpiarForm(){
  ['fn-nombre','fn-acudiente','fn-tel','fn-email','fn-obs'].forEach(id=>{
    document.getElementById(id).value='';
  });
  document.getElementById('fn-valor').value='180000';
  document.getElementById('fn-dia').value='1';
}

// ── INIT ──
loadJugadores();
</script>
